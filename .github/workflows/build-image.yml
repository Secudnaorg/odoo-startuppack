name: Build and push Docker image

# Construit l'image Odoo personnalisée et la pousse sur Harbor,
# comme l'image onboarding_platform.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag to publish
        required: false
        type: string

env:
  REGISTRY: public-harbor.gottaphish.com
  HARBOR_PROJECT: startuppack

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          image_name="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"

          tags="${REGISTRY}/${HARBOR_PROJECT}/${image_name}:${short_sha}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${tags},${REGISTRY}/${HARBOR_PROJECT}/${image_name}:latest"
          fi
          if [[ -n "${CUSTOM_TAG}" ]]; then
            tags="${tags},${REGISTRY}/${HARBOR_PROJECT}/${image_name}:${CUSTOM_TAG}"
          fi

          echo "image=${REGISTRY}/${HARBOR_PROJECT}/${image_name}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
